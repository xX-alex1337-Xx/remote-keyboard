[package]
name = "remote-keyboard"
version = "0.1.0"
edition = "2021"
authors = ["alexa"]
description = "Leichtgewichtiger Rust-Webserver zur Fernsteuerung von Windows PCs via iPad/iPhone"

[lib]
name = "remote_keyboard_lib"
path = "src/lib.rs"

[[bin]]
name = "remote-keyboard"
path = "src/bin/cli.rs"

[[bin]]
name = "remote-keyboard-tray"
path = "src/bin/tray.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt", "net", "sync", "macros", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = "0.14"
local-ip-address = "0.6"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
